<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --bg:#08080c;
  --bg-2:#0d0d14;
  --card:rgba(255,255,255,.035);
  --card-hover:rgba(255,255,255,.065);
  --border:rgba(255,255,255,.08);
  --border-strong:rgba(255,255,255,.14);
  --text:#f2f2f5;
  --muted:#9b9baa;
  --faint:#6a6a7a;
  --accent:#9146ff;
  --accent-soft:rgba(145,70,255,.18);
  --live:#ff4757;
  --ok:#3ddc84;
  --radius:16px;
  --radius-lg:22px;
  --maxw:520px;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:56px 20px 40px;
  overflow-x:hidden;
}

/* ============================================================
   FOND ANIMÉ (deux halos très lents, discrets)
   ============================================================ */
.glow{
  position:fixed;
  border-radius:50%;
  filter:blur(90px);
  pointer-events:none;
  z-index:0;
  opacity:.5;
}
.glow-1{
  width:min(520px,90vw);height:min(520px,90vw);
  top:-18%;left:50%;transform:translateX(-50%);
  background:radial-gradient(circle,rgba(145,70,255,.55),transparent 70%);
  animation:float1 18s ease-in-out infinite;
}
.glow-2{
  width:min(420px,80vw);height:min(420px,80vw);
  bottom:-14%;right:-12%;
  background:radial-gradient(circle,rgba(60,120,255,.32),transparent 70%);
  animation:float2 22s ease-in-out infinite;
}
@keyframes float1{
  0%,100%{transform:translateX(-50%) translateY(0)}
  50%{transform:translateX(-50%) translateY(38px)}
}
@keyframes float2{
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(-30px,-28px)}
}
/* grille très subtile par-dessus le fond */
body::after{
  content:'';
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:52px 52px;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 30%,#000,transparent 100%);
  -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 30%,#000,transparent 100%);
}

/* ============================================================
   LAYOUT
   ============================================================ */
main{
  position:relative;
  z-index:1;
  width:100%;
  max-width:var(--maxw);
  display:flex;
  flex-direction:column;
  gap:28px;
}
.reveal{opacity:0;transform:translateY(14px);animation:rise .7s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}

/* ============================================================
   PROFIL
   ============================================================ */
.profile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}

.avatar-wrap{position:relative;width:104px;height:104px}
.avatar{
  width:100%;height:100%;
  border-radius:50%;
  object-fit:cover;
  display:block;
  background:linear-gradient(140deg,#9146ff,#5b2bd6);
  border:2px solid rgba(255,255,255,.14);
  box-shadow:0 12px 40px rgba(145,70,255,.32);
  font-weight:800;font-size:40px;color:#fff;
}
/* fallback quand aucune image n'est fournie */
.avatar-fallback{
  display:flex;align-items:center;justify-content:center;
  letter-spacing:-1px;
  user-select:none;
}
.avatar-ring{
  position:absolute;inset:-7px;
  border-radius:50%;
  border:1.5px solid var(--accent);
  opacity:.35;
  animation:pulse 3.2s ease-out infinite;
}
@keyframes pulse{
  0%{transform:scale(1);opacity:.4}
  70%{transform:scale(1.13);opacity:0}
  100%{opacity:0}
}

h1{
  margin:0;
  font-size:29px;
  font-weight:800;
  letter-spacing:-.6px;
}
.handle{
  margin:0;
  color:var(--muted);
  font-size:14.5px;
  font-weight:500;
}
.bio{
  margin:2px 0 0;
  color:var(--faint);
  font-size:14px;
  max-width:340px;
}

/* badge live / hors ligne */
.status{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 13px 6px 11px;
  border-radius:999px;
  font-size:12.5px;font-weight:600;
  letter-spacing:.2px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--muted);
  text-decoration:none;
  transition:background .2s,border-color .2s,transform .2s;
}
.status:hover{background:var(--card-hover);border-color:var(--border-strong)}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.status.is-live{
  color:#fff;
  border-color:rgba(255,71,87,.45);
  background:rgba(255,71,87,.14);
}
.status.is-live .dot{
  background:var(--live);
  box-shadow:0 0 0 0 rgba(255,71,87,.7);
  animation:blink 1.6s ease-out infinite;
}
@keyframes blink{
  0%{box-shadow:0 0 0 0 rgba(255,71,87,.6)}
  70%{box-shadow:0 0 0 8px rgba(255,71,87,0)}
  100%{box-shadow:0 0 0 0 rgba(255,71,87,0)}
}

/* ============================================================
   BOUTONS RÉSEAUX
   ============================================================ */
.links{display:flex;flex-direction:column;gap:11px}

.link{
  position:relative;
  display:flex;align-items:center;gap:14px;
  padding:15px 18px;
  border-radius:var(--radius);
  background:var(--card);
  border:1px solid var(--border);
  color:var(--text);
  text-decoration:none;
  overflow:hidden;
  transition:transform .22s cubic-bezier(.2,.7,.3,1),background .22s,border-color .22s,box-shadow .22s;
}
.link::before{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(90deg,var(--brand-soft),transparent 60%);
  opacity:0;
  transition:opacity .25s;
}
.link:hover,.link:focus-visible{
  transform:translateY(-2px);
  background:var(--card-hover);
  border-color:var(--brand-line);
  box-shadow:0 10px 30px -12px var(--brand-glow);
  outline:none;
}
.link:hover::before,.link:focus-visible::before{opacity:1}
.link:active{transform:translateY(0)}

.link .icon{
  position:relative;
  flex:none;
  width:40px;height:40px;
  border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  background:var(--brand-soft);
  color:var(--brand);
  transition:background .25s,color .25s;
}
.link:hover .icon{background:var(--brand);color:#fff}
.link .icon svg{width:20px;height:20px;fill:currentColor}

.link .text{position:relative;display:flex;flex-direction:column;min-width:0}
.link .label{font-weight:600;font-size:15px;letter-spacing:-.1px}
.link .sub{
  font-size:12.5px;color:var(--faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.link .arrow{
  position:relative;
  margin-left:auto;
  color:var(--faint);
  flex:none;
  transition:transform .25s,color .25s;
}
.link:hover .arrow{transform:translateX(3px);color:var(--text)}
.link .arrow svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* couleurs de marque */
.link.twitch   {--brand:#9146ff;--brand-soft:rgba(145,70,255,.16);--brand-line:rgba(145,70,255,.42);--brand-glow:rgba(145,70,255,.5)}
.link.discord  {--brand:#5865f2;--brand-soft:rgba(88,101,242,.16);--brand-line:rgba(88,101,242,.42);--brand-glow:rgba(88,101,242,.5)}
.link.x        {--brand:#e7e7ea;--brand-soft:rgba(255,255,255,.10);--brand-line:rgba(255,255,255,.30);--brand-glow:rgba(255,255,255,.28)}
.link.x:hover .icon{color:#0a0a0f}
.link.instagram{--brand:#e1306c;--brand-soft:rgba(225,48,108,.16);--brand-line:rgba(225,48,108,.42);--brand-glow:rgba(225,48,108,.5)}
.link.instagram:hover .icon{background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)}

/* mise en avant du bouton principal */
.link.featured{
  background:linear-gradient(135deg,rgba(145,70,255,.20),rgba(145,70,255,.06));
  border-color:rgba(145,70,255,.32);
}

/* ============================================================
   PLANNING
   ============================================================ */
section{display:flex;flex-direction:column;gap:12px}

.section-head{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:12px;padding:0 4px;
}
.section-head h2{
  margin:0;
  font-size:13px;font-weight:700;
  letter-spacing:1.4px;text-transform:uppercase;
  color:var(--muted);
}
.section-head .hint{font-size:12px;color:var(--faint)}

.next-up{
  display:flex;align-items:center;gap:11px;
  padding:13px 16px;
  border-radius:var(--radius);
  background:linear-gradient(135deg,var(--accent-soft),rgba(145,70,255,.04));
  border:1px solid rgba(145,70,255,.26);
  font-size:14px;
}
.next-up .bolt{flex:none;color:var(--accent);display:flex}
.next-up .bolt svg{width:17px;height:17px;fill:currentColor}
.next-up strong{font-weight:650}
.next-up .when{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}

.schedule{
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  background:var(--card);
  overflow:hidden;
}
.day{
  display:flex;align-items:center;gap:14px;
  padding:13px 18px;
  border-top:1px solid var(--border);
  transition:background .2s;
}
.day:first-child{border-top:0}
.day .name{
  width:78px;flex:none;
  font-weight:600;font-size:14px;
  letter-spacing:-.1px;
}
.day .slot{
  font-size:14px;
  color:var(--text);
  font-variant-numeric:tabular-nums;
}
.day .game{
  font-size:12.5px;color:var(--faint);
  margin-left:auto;text-align:right;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:45%;
}
.day.off .name,.day.off .slot{color:var(--faint);font-weight:500}
.day.off .slot{font-style:italic}

.day.today{background:rgba(145,70,255,.09)}
.day.today .name{color:var(--accent)}
.day.today::before{
  content:'';
  width:3px;height:20px;border-radius:2px;
  background:var(--accent);
  margin:0 -8px 0 -8px;
}
.tag{
  font-size:10.5px;font-weight:700;letter-spacing:.6px;
  text-transform:uppercase;
  padding:3px 7px;border-radius:6px;
  background:var(--accent-soft);color:#c9a6ff;
  flex:none;
}
.tag.live{background:rgba(255,71,87,.18);color:#ff8b95}

/* ============================================================
   PIED DE PAGE
   ============================================================ */
footer{
  position:relative;z-index:1;
  margin-top:36px;
  text-align:center;
  color:var(--faint);
  font-size:12px;
  display:flex;flex-direction:column;gap:8px;align-items:center;
}
.copy-btn{
  background:none;border:1px solid var(--border);
  color:var(--muted);
  font:inherit;font-size:12px;
  padding:7px 14px;border-radius:999px;
  cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;
  transition:background .2s,color .2s,border-color .2s;
}
.copy-btn:hover{background:var(--card-hover);color:var(--text);border-color:var(--border-strong)}
.copy-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ============================================================
   RESPONSIVE / A11Y
   ============================================================ */
@media (max-width:420px){
  body{padding:38px 16px 32px}
  h1{font-size:25px}
  .day{padding:12px 14px;gap:10px}
  .day .name{width:66px;font-size:13.5px}
  .day .slot{font-size:13.5px}
  .day .game{display:none}
  .link{padding:13px 15px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .reveal{opacity:1;transform:none}
}
</style>
</head>

<script>
/* ============================================================================
   PLANNING — C'EST ICI QUE TU MODIFIES TES HORAIRES
   ----------------------------------------------------------------------------
   day   : 0 = dimanche, 1 = lundi, 2 = mardi, ... 6 = samedi
   start : heure de début, format "HH:MM" (24h, heure de Paris)
   end   : heure de fin  — peut dépasser minuit ("01:30" = 1h30 du matin)
   game  : texte libre affiché à droite (facultatif)
   off   : true  => jour sans stream
   ============================================================================ */
const SCHEDULE = [
  { day:1, off:true },
  { day:2, start:"21:00", end:"00:00", game:"Just Chatting" },
  { day:3, start:"21:00", end:"00:00", game:"Gaming" },
  { day:4, off:true },
  { day:5, start:"21:00", end:"00:30", game:"Gaming" },
  { day:6, start:"15:00", end:"19:00", game:"Session longue" },
  { day:0, start:"15:00", end:"19:00", game:"Chill" },
];

/* Ordre d'affichage : lundi → dimanche */
const ORDER = [1,2,3,4,5,6,0];
const DAY_NAMES = ["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const TZ = "Europe/Paris";

/* --- Heure courante à Paris, quel que soit le fuseau du visiteur --- */
function parisNow(){
  const parts = new Intl.DateTimeFormat("fr-FR",{
    timeZone:TZ, weekday:"short", hour:"2-digit", minute:"2-digit", hour12:false
  }).formatToParts(new Date());
  const get = t => parts.find(p => p.type === t).value;
  const wd = { dim:0, lun:1, mar:2, mer:3, jeu:4, ven:5, sam:6 };
  const key = get("weekday").toLowerCase().slice(0,3).replace(".","");
  return {
    day: wd[key] ?? new Date().getDay(),
    minutes: parseInt(get("hour"),10) * 60 + parseInt(get("minute"),10)
  };
}

const toMin = hhmm => {
  const [h,m] = hhmm.split(":").map(Number);
  return h * 60 + m;
};

/* Un créneau est « en cours » si maintenant est entre start et end,
   en tenant compte des sessions qui débordent après minuit. */
function slotState(entry, now){
  if (entry.off) return { live:false, minutesUntil:null };

  const start = toMin(entry.start);
  let end = toMin(entry.end);
  const overnight = end <= start;
  if (overnight) end += 1440;

  // en direct le jour même
  if (now.day === entry.day && now.minutes >= start && now.minutes < end) return { live:true };
  // en direct le lendemain matin (créneau qui a débordé)
  if (overnight && now.day === (entry.day + 1) % 7 && now.minutes + 1440 < end) return { live:true };

  // délai avant le prochain démarrage (en minutes)
  let delta = ((entry.day - now.day + 7) % 7) * 1440 + start - now.minutes;
  if (delta < 0) delta += 7 * 1440;
  return { live:false, minutesUntil:delta };
}

function humanDelay(min){
  if (min < 60) return `dans ${min} min`;
  const h = Math.floor(min / 60);
  if (h < 24) return `dans ${h} h`;
  const d = Math.round(h / 24);
  return d === 1 ? "demain" : `dans ${d} jours`;
}

function render(){
  const now = parisNow();
  const container = document.getElementById("schedule");
  container.innerHTML = "";

  let liveEntry = null;
  let next = null;

  ORDER.forEach(d => {
    const entry = SCHEDULE.find(e => e.day === d) || { day:d, off:true };
    const state = slotState(entry, now);

    if (state.live) liveEntry = entry;
    if (!state.live && state.minutesUntil != null && (!next || state.minutesUntil < next.minutesUntil)){
      next = { entry, minutesUntil:state.minutesUntil };
    }

    const row = document.createElement("div");
    row.className = "day" + (entry.off ? " off" : "") + (d === now.day ? " today" : "");

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = DAY_NAMES[d];

    const slot = document.createElement("span");
    slot.className = "slot";
    slot.textContent = entry.off ? "Repos" : `${entry.start} — ${entry.end}`;

    row.append(name, slot);

    if (state.live){
      const tag = document.createElement("span");
      tag.className = "tag live";
      tag.textContent = "En direct";
      row.appendChild(tag);
    }

    if (!entry.off && entry.game){
      const game = document.createElement("span");
      game.className = "game";
      game.textContent = entry.game;
      row.appendChild(game);
    }

    container.appendChild(row);
  });

  /* --- badge de statut --- */
  const status = document.getElementById("status");
  const statusText = document.getElementById("status-text");
  if (liveEntry){
    status.classList.add("is-live");
    statusText.textContent = "Stream prévu maintenant";
  } else {
    status.classList.remove("is-live");
    statusText.textContent = "Hors ligne";
  }

  /* --- bandeau « prochain live » --- */
  const banner = document.getElementById("next-up");
  if (liveEntry){
    banner.hidden = false;
    document.getElementById("next-up-text").innerHTML =
      `<strong>Live en cours</strong>${liveEntry.game ? " — " + liveEntry.game : ""}`;
    document.getElementById("next-up-when").textContent = `jusqu'à ${liveEntry.end}`;
  } else if (next){
    banner.hidden = false;
    document.getElementById("next-up-text").innerHTML =
      `<strong>Prochain live</strong> — ${DAY_NAMES[next.entry.day]} ${next.entry.start}`;
    document.getElementById("next-up-when").textContent = humanDelay(next.minutesUntil);
  } else {
    banner.hidden = true;
  }
}

render();
setInterval(render, 60000);

document.getElementById("year").textContent = new Date().getFullYear();

/* --- copier le lien de la page --- */
document.getElementById("copy-btn").addEventListener("click", async () => {
  const label = document.getElementById("copy-label");
  try {
    await navigator.clipboard.writeText(location.href);
    label.textContent = "Lien copié !";
  } catch {
    label.textContent = location.href;
  }
  setTimeout(() => { label.textContent = "Copier le lien"; }, 2000);
});
</script>
